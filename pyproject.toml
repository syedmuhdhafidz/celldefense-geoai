[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "celldefense-geoai"
version = "0.1.0"
description = "GeoAI decision-support prototype for suspicious base-station anomaly triage."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]